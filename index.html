<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人美食口袋名單</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>我的個人美食口袋名單</h1>
            <p>記錄與分享私房美食、小吃與早午餐</p>
        </div>
    </header>

    <main class="container">
        <section class="filter-section">
            <button class="active">全部</button>
            <button>早午餐</button>
            <button>小吃</button>
            <button>麵食</button>
            <button>速食</button>
        </section>

        <section class="restaurant-grid">
            <div class="restaurant-card">
                <h3>早安有喜</h3>
                <p class="category">分類：早午餐</p>
                <p class="recommend">推薦：French toast, 蛋餅</p>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <p class="desc">氣氛舒適，餐點選擇豐富多樣。</p>
            </div>
            <div class="restaurant-card">
                <h3>麥當勞</h3>
                <p class="category">分類：速食</p>
                <p class="recommend">推薦：薯條, 雞塊, 玉米濃湯</p>
                <div class="rating">⭐⭐⭐⭐</div>
                <p class="desc">宵夜與快速解決一餐的好選擇。</p>
            </div>
            <div class="restaurant-card">
                <h3>拿坡里</h3>
                <p class="category">分類：披薩炸雞</p>
                <p class="recommend">推薦：炸雞, 夏威夷披薩</p>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <p class="desc">炸雞皮脆多汁，聚餐首選。</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 我的美食口袋名單</p>
        </div>
    </footer>
</body>
</html>
